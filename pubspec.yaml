name: oscar_ebin_app
description: "Oscar - App de reciclaje inteligente con gamificación"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  mobile_scanner: ^7.0.0

  # Navigation
  go_router: ^12.1.3

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Networking & Storage
  http: ^1.6.0
  shared_preferences: ^2.2.0

  # Utils
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"